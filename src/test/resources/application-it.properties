# Perfil de las pruebas de integracion.
#
# El datasource lo inyecta el contenedor (@DynamicPropertySource); aqui solo
# estan los secretos que la aplicacion exige para arrancar y los interruptores
# que no deben tocarse en un build.

kardo.security.jwt.secret=kardo-secreto-de-integracion-con-mas-de-32-bytes
kardo.security.cors.allowed-origins=http://localhost:5173

# Nada de heartbeats ni llamadas a Google durante el build.
kardo.keepalive.enabled=false
kardo.gemini.api-key=clave-inexistente-para-pruebas

logging.level.com.kardo=INFO
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
