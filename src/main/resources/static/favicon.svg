<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Kardo">
  <!--
    Tres lotes en cola. El de arriba va desplazado a la derecha y es el unico
    opaco: es el que sale primero, que es la regla entera del producto. Los de
    abajo esperan su turno y se van apagando.
  -->
  <rect width="32" height="32" rx="8" fill="#2F4F86"/>
  <rect x="12" y="7.5"  width="14" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="6"  y="15"   width="14" height="5" rx="2.5" fill="#FFFFFF" opacity=".52"/>
  <rect x="6"  y="22.5" width="14" height="5" rx="2.5" fill="#FFFFFF" opacity=".28"/>
</svg>
