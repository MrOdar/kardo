# ============================================================================
#  Kardo - Configuracion base (Render container, limite estricto 512 MB RAM)
# ============================================================================
spring.application.name=kardo

# ---------------------------------------------------------------------------
#  Red: puerto dinamico asignado por Render (fallback 8080 en local)
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain

# Virtual Threads (Java 21): concurrencia I/O-bound sin inflar el pool de hilos
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
#  Multipart: spooling a disco FUERA del Java Heap.
#  Con threshold de 64KB Tomcat escribe el archivo en /tmp y fastexcel
#  lee el flujo directamente via file.getInputStream().
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=64KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
#  PostgreSQL 15 (Supabase). Credenciales SOLO por variables de entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP acotado: la capa gratuita de Supabase limita las conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=KardoHikariPool
# El heartbeat diario valida la conexion antes de usarla
spring.datasource.hikari.connection-test-query=SELECT 1

# El esquema se gestiona manualmente con sql/01_schema_ddl_3nf.sql y
# sql/02_procedures_and_triggers.sql ejecutados en Supabase.
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
#  Ingesta en streaming: micro-lotes de JdbcTemplate.batchUpdate y
#  Circuit Breaker de calidad (aborta con HTTP 422 al superar el umbral).
# ---------------------------------------------------------------------------
kardo.ingest.batch-size=500
kardo.ingest.max-corrupt-rows=100

# ---------------------------------------------------------------------------
#  Keep-Alive hibrido
#  Capa 1: UptimeRobot -> GET /api/v1/ping cada 5 min (0 consultas a BD).
#  Capa 2: heartbeat interno SELECT 1 al mediodia, evita la pausa de
#          Supabase por 7 dias de inactividad.
# ---------------------------------------------------------------------------
kardo.keepalive.enabled=true
kardo.keepalive.cron=0 0 12 * * ?
kardo.keepalive.zone=America/Lima

# ---------------------------------------------------------------------------
#  Seguridad: JWT stateless (HS256) + CORS para el SPA en Vercel
# ---------------------------------------------------------------------------
kardo.security.jwt.secret=${JWT_SECRET}
kardo.security.jwt.issuer=kardo
kardo.security.jwt.expiration=PT8H
kardo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
#  Gemini 2.0 Flash (Sprint 3): timeouts de 20 s para absorber picos de la API
# ---------------------------------------------------------------------------
kardo.gemini.api-key=${GEMINI_API_KEY:}
kardo.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
kardo.gemini.model=gemini-3.8-flash
kardo.gemini.connect-timeout=PT20S
kardo.gemini.read-timeout=PT20S
kardo.gemini.max-attempts=3

# ---------------------------------------------------------------------------
#  Observabilidad minima
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.root=INFO
logging.level.com.kardo=INFO

# ---------------------------------------------------------------------------
#  Vision IA: resolucion y compresion del payload enviado a Gemini.
#  1800 px conserva legibles fuentes de 6 pt en una factura A4 (~350 KB).
# ---------------------------------------------------------------------------
kardo.vision.max-dimension=1800
kardo.vision.jpeg-quality=0.85

# Modelos de respaldo ante 429/503 del tier gratuito de Google AI Studio
kardo.gemini.fallback-models=gemini-3.5-flash,gemini-2.5-flash

# ---------------------------------------------------------------------------
#  Entity matching de SKUs: por debajo de este word_similarity el producto
#  se considera nuevo y el operario lo vincula a mano.
# ---------------------------------------------------------------------------
kardo.matching.min-score=0.35

# ---------------------------------------------------------------------------
#  Auditoria: detras del proxy de Render, la IP real llega en X-Forwarded-For.
#  Sin esto se registraria siempre la direccion del proxy.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
#  Retencion de la IP de origen (Ley 29733). Pasada la ventana se borra: el
#  asiento conserva quien, que y cuando, y pierde el dato que ya no sirve.
# ---------------------------------------------------------------------------
kardo.audit.ip-retention-days=90
kardo.audit.purge-cron=0 30 3 * * ?
