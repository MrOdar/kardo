# ============================================================================
#  Kardo - Configuracion base (Render container, limite estricto 512 MB RAM)
# ============================================================================
spring.application.name=kardo

# ---------------------------------------------------------------------------
#  Red: puerto dinamico asignado por Render (fallback 8080 en local)
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain

# Virtual Threads (Java 21): concurrencia I/O-bound sin inflar el pool de hilos
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------
#  Multipart: spooling a disco FUERA del Java Heap.
#  Con threshold de 64KB Tomcat escribe el archivo en /tmp y fastexcel
#  lee el flujo directamente via file.getInputStream().
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=64KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
#  PostgreSQL 15 (Supabase). Credenciales SOLO por variables de entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP acotado: la capa gratuita de Supabase limita las conexiones
# Dialecto fijado en vez de deducido. La autoconfiguracion lo resuelve abriendo
# una conexion durante el refresco del contexto: con Supabase pausado o la red
# caida al arrancar, el contenedor de Render no levanta y ni siquiera responde
# /api/v1/ping, que es el endpoint encargado de mantenerlo vivo.
spring.data.jdbc.dialect=postgresql

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=KardoHikariPool
# El heartbeat diario valida la conexion antes de usarla
spring.datasource.hikari.connection-test-query=SELECT 1

# El esquema se gestiona manualmente con sql/01_schema_ddl_3nf.sql y
# sql/02_procedures_and_triggers.sql ejecutados en Supabase.
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
#  Ingesta en streaming: micro-lotes de JdbcTemplate.batchUpdate y
#  Circuit Breaker de calidad (aborta con HTTP 422 al superar el umbral).
# ---------------------------------------------------------------------------
kardo.ingest.batch-size=500
kardo.ingest.max-corrupt-rows=100
# Tope de filas por archivo: lo pide el tiempo de transaccion, no la memoria.
# Un .xlsx de 10MB comprimido puede traer millones de filas y cada una son
# escrituras dentro de una sola transaccion sobre un pool de cinco conexiones.
kardo.ingest.max-rows=200000

# ---------------------------------------------------------------------------
#  Keep-Alive hibrido
#  Capa 1: UptimeRobot -> GET /api/v1/ping cada 5 min (0 consultas a BD).
#  Capa 2: heartbeat interno SELECT 1 al mediodia, evita la pausa de
#          Supabase por 7 dias de inactividad.
# ---------------------------------------------------------------------------
kardo.keepalive.enabled=true
kardo.keepalive.cron=0 0 12 * * ?
kardo.keepalive.zone=America/Lima

# ---------------------------------------------------------------------------
#  Seguridad: JWT stateless (HS256) + CORS para el SPA en Vercel
# ---------------------------------------------------------------------------
kardo.security.jwt.secret=${JWT_SECRET}
kardo.security.jwt.issuer=kardo
kardo.security.jwt.expiration=PT8H
kardo.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
#  Gemini 2.0 Flash (Sprint 3): timeouts de 20 s para absorber picos de la API
# ---------------------------------------------------------------------------
kardo.gemini.api-key=${GEMINI_API_KEY:}
kardo.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
kardo.gemini.model=gemini-3.8-flash
kardo.gemini.connect-timeout=PT20S
kardo.gemini.read-timeout=PT20S
kardo.gemini.max-attempts=3

# ---------------------------------------------------------------------------
#  Observabilidad minima
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
#  Frenos de los dos endpoints publicos.
#
#  /auth/login: cinco fallos por cuenta y veinte por IP en quince minutos. El
#  limite por IP es mas alto porque una tienda entera puede salir por una sola
#  IP, y el que de verdad protege a una cuenta concreta es el otro.
#
#  /demo/reset: borra y resiembra la tienda 999 en cada llamada, asi que lleva
#  un intervalo minimo global (la tienda demo es una sola y dos evaluadores a la
#  vez se pisan el escenario) y un tope por IP mas holgado.
# ---------------------------------------------------------------------------
kardo.throttle.login.max-per-account=${LOGIN_MAX_ACCOUNT:5}
kardo.throttle.login.max-per-ip=${LOGIN_MAX_IP:20}
kardo.throttle.login.window=PT15M
kardo.throttle.demo.min-interval=${DEMO_MIN_INTERVAL:PT20S}
kardo.throttle.demo.max-per-ip=10
kardo.throttle.demo.window=PT10M
kardo.throttle.registration.max-per-ip=${REGISTER_MAX_IP:3}
kardo.throttle.registration.window=PT1H

# ---------------------------------------------------------------------------
#  Contrato navegable de la API (/swagger-ui.html). Se apaga entero con
#  SPRINGDOC_ENABLED=false, y entonces las dos rutas devuelven 404 en vez de
#  existir sin contenido.
#
#  Los endpoints se ordenan por metodo y no por el orden en que Spring los
#  descubre, que cambia entre arranques y hace ilegible la pagina.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-order-by-keys=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
#  Observabilidad. Las metricas viven en memoria (no hay recolector al que
#  enviarlas y levantarlo costaria mas que el propio despliegue); el diagnostico
#  se lee por /api/v1/ops/diagnostics, que las traduce a una frase.
#  Los percentiles se calculan en la aplicacion para no tener que exportar
#  histogramas completos, que es lo que de verdad consume memoria.
# ---------------------------------------------------------------------------
management.metrics.distribution.percentiles-histogram.http.server.requests=false
kardo.diagnostics.slow-request-ms=${SLOW_REQUEST_MS:1500}

# Una linea por peticion con el reparto de su tiempo. En DEBUG salen todas; en
# INFO (el valor por defecto) solo las lentas y las que fallan.
logging.level.com.kardo.diagnostics=INFO
# El id de traza viaja en el MDC y tambien vuelve al cliente en X-Request-Id:
# quien reporta un fallo trae consigo la clave para encontrar su linea.
logging.pattern.level=%5p [%X{requestId:-sin-traza}]
logging.level.root=INFO
logging.level.com.kardo=INFO

# ---------------------------------------------------------------------------
#  Vision IA: resolucion y compresion del payload enviado a Gemini.
#  1800 px conserva legibles fuentes de 6 pt en una factura A4 (~350 KB).
# ---------------------------------------------------------------------------
kardo.vision.max-dimension=1800
kardo.vision.jpeg-quality=0.85
# Tope de pixeles de la imagen de ENTRADA, comprobado antes de decodificar: un
# PNG de 60KB puede declarar 30000x30000px, que son 3,6GB de buffer en un
# contenedor de 512MB. 40Mpx deja pasar cualquier camara de telefono.
kardo.vision.max-pixels=40000000

# ---------------------------------------------------------------------------
#  Tope diario de escaneos. Es lo unico que gasta dinero fuera de nuestra
#  infraestructura, y la API key es una sola para todo el despliegue: sin tope,
#  una tienda en bucle deja sin recepcion documental a las demas.
#  Los numeros son deliberadamente conservadores frente al tier gratuito; se
#  suben por variable de entorno cuando el consumo real lo justifique.
# ---------------------------------------------------------------------------
kardo.vision.quota.per-store-daily=${VISION_QUOTA_STORE:40}
kardo.vision.quota.global-daily=${VISION_QUOTA_GLOBAL:200}

# Modelos de respaldo ante 429/503 del tier gratuito de Google AI Studio
kardo.gemini.fallback-models=gemini-3.5-flash,gemini-2.5-flash

# ---------------------------------------------------------------------------
#  Entity matching de SKUs: por debajo de este word_similarity el producto
#  se considera nuevo y el operario lo vincula a mano.
# ---------------------------------------------------------------------------
kardo.matching.min-score=0.35

# ---------------------------------------------------------------------------
#  Auditoria: detras del proxy de Render, la IP real llega en X-Forwarded-For.
#  Sin esto se registraria siempre la direccion del proxy.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
#  Retencion de la IP de origen (Ley 29733). Pasada la ventana se borra: el
#  asiento conserva quien, que y cuando, y pierde el dato que ya no sirve.
# ---------------------------------------------------------------------------
kardo.audit.ip-retention-days=90
kardo.audit.purge-cron=0 30 3 * * ?
